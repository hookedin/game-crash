# Every push tests and builds; a push to main publishes the page and the flight room to Cloudflare, given the
# CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable. The Worker's DEVELOPER_KEY secret is set once
# with `npx wrangler secret put DEVELOPER_KEY`; a deploy keeps it.
name: Deploy
on: [push, workflow_dispatch]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Publish to Cloudflare
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
