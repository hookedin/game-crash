# Every push tests and builds; a push to main publishes the page and the flight room to Cloudflare, given the
# CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable. The Worker's DEVELOPER_KEY secret is set once
# with `npx wrangler secret put DEVELOPER_KEY`; a deploy keeps it.
name: Deploy
on: [push, workflow_dispatch]
# One run per branch at a time, each from the branch as it stands, so a run queued behind another can push the lockfile.
concurrency: deploy-${{ github.ref }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Every build takes play's newest main, and play's release runs this workflow when main moves.
      - run: npm update @hookedin/play
      - run: npm run format:check
      - run: npm test
      # main's lockfile names the play this run tested, so a clone installs it. A push with the workflow's token starts no
      # run of its own.
      - name: Record play in the lockfile
        if: github.ref == 'refs/heads/main'
        run: |
          git diff --quiet package-lock.json && exit 0
          play=$(node -p "require('./package-lock.json').packages['node_modules/@hookedin/play'].resolved.split('#')[1].slice(0, 7)")
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update play to $play" -- package-lock.json
          git push origin HEAD:main
      - name: Publish to Cloudflare
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
