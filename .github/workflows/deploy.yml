# Every push tests and builds; a push to main is the release: publish the page and the flight room to Cloudflare, as the
# Worker named in wrangler.jsonc.
# Settings (repository → Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN    a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   variable CLOUDFLARE_ACCOUNT_ID   your Cloudflare account ID
# The Worker's own secret, DEVELOPER_KEY, is set once with `npx wrangler secret put DEVELOPER_KEY`; a deploy keeps it.
# Only main publishes: every other branch stops after the tests and the build.
# Without the token even main stops there; it just does not publish.
name: Deploy
on: [push, workflow_dispatch]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Publish to Cloudflare
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
